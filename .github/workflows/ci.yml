name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prompton-dev/core build
      - run: pnpm --filter @prompton-dev/ui build
      - run: pnpm --filter @prompton-dev/agent build
      - run: pnpm --filter @prompton-dev/indexer build
      - run: pnpm --filter @prompton-dev/starlight build
      - run: pnpm --filter create-prompton build
      # Astro Cloudflare prerender/remote bindings need a token in CI
      - run: pnpm --filter @prompton-dev/starter build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy starter
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN missing — skipping deploy (build still passed)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: pnpm --filter @prompton-dev/core --filter @prompton-dev/ui --filter @prompton-dev/agent --filter @prompton-dev/indexer --filter @prompton-dev/starlight build
      - if: steps.check.outputs.skip != 'true'
        run: pnpm exec astro build
        working-directory: examples/starter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.check.outputs.skip != 'true'
        name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: examples/starter
          command: deploy
      - if: steps.check.outputs.skip != 'true'
        name: Reindex docs
        env:
          PROMPTON_REINDEX_SECRET: ${{ secrets.PROMPTON_REINDEX_SECRET }}
          PROMPTON_URL: ${{ vars.PROMPTON_URL }}
        run: |
          if [ -z "$PROMPTON_REINDEX_SECRET" ]; then
            echo "PROMPTON_REINDEX_SECRET not set; skipping reindex"
            exit 0
          fi
          URL="${PROMPTON_URL:-https://prompton.dev}"
          curl -fsS -X POST \
            -H "x-prompton-reindex-secret: $PROMPTON_REINDEX_SECRET" \
            "$URL/api/prompton/reindex"
