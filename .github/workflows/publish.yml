name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node ≥22.14 and npm ≥11.5.1
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prompton-dev/core build
      - run: pnpm --filter @prompton-dev/ui build
      - run: pnpm --filter @prompton-dev/agent build
      - run: pnpm --filter @prompton-dev/indexer build
      - run: pnpm --filter @prompton-dev/starlight build
      - run: pnpm --filter create-prompton build
      - name: Publish packages via OIDC (dependency order)
        run: |
          # Do not set NODE_AUTH_TOKEN / NPM_TOKEN — npm must use GitHub OIDC.
          # Each package must have a Trusted Publisher on npmjs.com pointing at:
          #   org: prompton-dev  repo: prompton  workflow: publish.yml
          set -euo pipefail
          for pkg in \
            @prompton-dev/core \
            @prompton-dev/ui \
            @prompton-dev/agent \
            @prompton-dev/indexer \
            @prompton-dev/starlight \
            create-prompton
          do
            echo "::group::Publish $pkg"
            pnpm --filter "$pkg" publish --access public --no-git-checks
            echo "::endgroup::"
          done
